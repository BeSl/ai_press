name = "ai-press-api"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Привяжите KV-namespace, см. README.
# Замените id и preview_id после `wrangler kv namespace create STATS`.
[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# По умолчанию воркер выкладывается на <name>.<account>.workers.dev — этого хватает.
# Если хотите свой домен (api.example.com), раскомментируйте и настройте route.
# [[routes]]
# pattern = "api.example.com/*"
# zone_name = "example.com"
